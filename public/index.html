<!DOCTPYE hmtl>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>My App</title>
  </head>
  <body>
    <div id="main_page">
    <!--Website Banner-->
    <div class="banner">
        <div class="banner_content">
            <h1>MARKET</h1>
        </div>
            <div id="search_bar">
                <input type="text" id="search_input" placeholder="Search for products..." />
              <button id="search_button">Search</button>
              <button id="login_button">Login</button>
        </div>
    </div>

    <div class="sidebar">
      <nav>
        <a class="active" href="#home" aria-label="Home">Home</a>
        <a href="#listings" aria-label="Listings">Listings</a>
        <a href="#account" aria-label="Your Account">Your Account</a>
        <a href="#about" aria-label="About">About</a>
      </nav>
    </div>
    
    <!-- Product Listings -->
    <div id="listing_container"></div>

    </div>
    
    <!-- Login/Sign Up Screen -->
    <div id="login_screen" class="login_screen" style="display:none;">
      <div class="login_container">
          <h2>Login</h2>
  
          <form id="login_form">
              <label>Email</label>
              <input type="email" id="login_email" required>
  
              <label>Password</label>
              <input type="password" id="login_password" required>
  
              <button type="submit">Login</button>
          </form>
  
          <p>
              Don't have an account?
              <a href="#" id="show_signup">Create one</a>
          </p>
  
          <button id="login_back">Back</button>
      </div>
  </div>
  
  <div id="signup_screen" class="login_screen" style="display:none;">
      <div class="login_container">
          <h2>Create Account</h2>
  
          <form id="signup_form">
              <label>Username</label>
              <input type="text" id="signup_username" required>
  
              <label>Email</label>
              <input type="email" id="signup_email" required>
  
              <label>Password</label>
              <input type="password" id="signup_password" required>
  
              <button type="submit">Create Account</button>
          </form>
  
          <p>
              Already have an account?
              <a href="#" id="show_login">Login</a>
          </p>
  
          <button id="signup_back">Back</button>
      </div>
  </div>


    
    <script src="index.js"></script>

        
        <script src="index.js"></script>
  </body>
