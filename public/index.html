<!DOCTYPE hmtl>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>My App</title>
  </head>
  <body>
    <div id="main_page">
    <!--Website Banner-->
    <div class="banner">
        <div class="banner_content">
            <h1>MARKET</h1>
        </div>
            <div id="search_bar">
                <input type="text" id="search_input" placeholder="Search for products..." />
              <button id="login_button">Login</button>
              <button id="cart_button">Cart</button>
        </div>
    </div>

    <div class="sidebar">
      <nav>
        <a class="active" href="#home" aria-label="Home">Home</a>
        <a href="#listings" aria-label="Listings">Listings</a>
        <a href="#account" aria-label="Your Account">Your Account</a>
        <a href="#about" aria-label="About">About</a>
      </nav>
    </div>

      <!-- Card Sidebar -->
       <div class="sidebar_cart">
        <div class="cart_content">
          <div class="cart_header">
            <h2>Your Cart</h2>
          </div>
          <div id="cart_items"></div>
          <div class="cart_actions"></div>
       </div>
    </div>
    
    <!-- Product Listings -->
    <div id="listing_container"></div>

    </div>
    
    <!-- Login/Sign Up Screens -->
    <div id="login_screen" class="screen" style="display: none;">
      <div class="login_container">
        <h2>Log in</h2>
        <form id="login_form">
          <label for="email">Email</label>
          <input type="email" name= "email" id="login_email" placeholder="Email..." required />
          
          <label for="password">Password</label>
          <input type="password" name="password" id="login_password" placeholder="Password..." required />
          <button type="submit">Login</button>
        </form>
        <button id="signupScreen_button">Sign Up?</button>
        <button id="home_button">Back</button>
      </div>
    </div>

    <div id="signup_screen" class="screen" style="display: none;">
      <div class="signup_container">
        <h2>Sign Up</h2>
        <form id="signup_form">
          <label for="email">Email</label>
          <input type="email" name="email" id="signup_email" placeholder="Email..." required />

          <label for ="username">Username</label>
          <input type="text" name="username" id="signup_username" placeholder="Username..." required />

          <label for="password">Password</label>
          <input type="password" name="password" id="signup_password" placeholder="Password..." required />
          <button type="submit">Sign Up</button>
        </form>
        <button id="loginScreen_button">Login?</button>
        <button id="home_button">Back</button>
      </div>
    </div>
    <script src="index.js"></script>
  </body>
