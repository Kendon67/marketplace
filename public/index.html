<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="index.css" />
    <title>My App</title>
  </head>
  <body>
     <!--Website Banner-->
     <div class="banner">
      <div class="banner_left">
          <h1>MARKET</h1>
      </div>
      <div class="banner_middle">
        <div id="search_bar">
            <input type="text" id="search_input" placeholder="Search for products..." />
        </div>
    </div>

      <div class="banner_right">
          <button class="button" id="login_button">Login</button>
          <button class="button" id="cart_button">Cart</button>
      </div>
  </div>
    <div id="main_page">
      <!-- Card Sidebar -->
       <div class="sidebar_cart">
        <div class="cart_content">
          <div class="cart_header">
            <h2>Your Cart</h2>
            <span id="cart_total"></span>
          </div>
          <div id="cart_items"></div>
          <div class="cart_actions"></div>
       </div>
    </div>
    
    <!-- Product Listings -->
    <div id="listing_container"></div>
    </div>

    <!-- Account Page-->
     <div id="account_screen">
      <p>ACCOUNT!!</p>
      <div id="account_card">
        <button class="button" id="change_email_button">Change Email</button>
        <button class="button" id="change_username_button">Change Username</button>
        <button class="button" id="change_password_button">Change Password</button>
        <button class="button" id="delete_account_button">Delete Account</button>
      </div>
     </div>

      <!-- Listings Page-->
      <div id="listings_screen">
        <p>Your Listings</p>
        <button id="create_listing_button">Add Listing</button>
        <div id="user_listings_container"></div>
        <form id="add_listing_form">
          <label for="listing_name">Name</label>
          <input type="text" name="name" id="listing_name" placeholder="Item Name..." required />
      
          <label for="listing_description">Description</label>
          <input type="text" name="description" id="listing_description" placeholder="Item Description..." required />
      
          <label for="listing_category">Category</label>
          <input type="text" name="category" id="listing_category" placeholder="Category..." required />
      
          <label for="listing_price">Price (£)</label>
          <input type="number" name="price" id="listing_price" placeholder="Price..." step="0.01" min="0" required />
      
          <label for="listing_image">Image URL</label>
          <input type="text" name="image" id="listing_image" placeholder="Image URL..." required />
      
          <button type="submit" id="submit_listing_button">Add Listing</button>
      </form>
    </div>

    <!-- About Page -->
     <div id="about_screen"></div>

     <div class="sidebar">
      <nav>
        <button class="nav_button active" id="home_screen_button" data-page="home">Home</button>
        <button class="nav_button" id="listings_screen_button" data-page="listings">Listings</button>
        <button class="nav_button" id="account_screen_button" data-page="account">Your Account</button>
        <button class="nav_button" id="about_screen_button" data-page="about">About</button>
      </nav>      
    </div>
    
    <!-- Login/Sign Up Pages -->
    <div id="login_screen" class="screen">
      <div class="login_container">
        <h2>Log in</h2>
        <form id="login_form">
          <label for="email">Email</label>
          <input type="email" name= "email" id="login_email" placeholder="Email..." required />
          
          <label for="password">Password</label>
          <input type="password" name="password" id="login_password" placeholder="Password..." required />
          <button type="submit">Login</button>
        </form>
        <button id="signupScreen_button">Sign Up?</button>
        <button id="login_home_button">Back</button>
      </div>
    </div>

    <div id="signup_screen" class="screen" style="display: none;">
      <div class="signup_container">
        <h2>Sign Up</h2>
        <form id="signup_form">
          <label for="email">Email</label>
          <input type="email" name="email" id="signup_email" placeholder="Email..." required />

          <label for ="username">Username</label>
          <input type="text" name="username" id="signup_username" placeholder="Username..." required />

          <label for="password">Password</label>
          <input type="password" name="password" id="signup_password" placeholder="Password..." required />
          <button type="submit">Sign Up</button>
        </form>
        <button id="loginScreen_button">Login?</button>
        <button id="signup_home_button">Back</button>
      </div>
    </div>

    <script src="index.js"></script>
  </body>
